<header class="wall-header">
  <div class="wall-heading-row">
    <div class="wall-title">
      <div *ngIf="editingField !== 'name'" class="wall-title-line">
        <h1>{{ wall.name }}</h1>
        <button *ngIf="isOwner" type="button" class="wall-field-edit-button" (click)="startEdit()">
          <img src="/assets/icons/section-pencil.svg" alt="Edit name">
        </button>
      </div>
      <div *ngIf="editingField === 'name'" class="wall-field-inline">
        <input
          aria-label="Wall name"
          [(ngModel)]="editingValue"
          maxlength="100"
          (keydown.enter)="saveField()"
          (keydown.escape)="cancelEdit()">
        <div class="wall-field-actions">
          <button
            type="button"
            class="wall-field-action"
            aria-label="Save wall name"
            title="Save wall name"
            [disabled]="!editingValue.trim()"
            (click)="saveField()">
            <img src="/assets/icons/section-check.svg" alt="">
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="isOwner" class="wall-header-actions">
      <div class="customize-control" [class.open]="appearanceOpen">
        <button
          type="button"
          class="customize-button"
          aria-label="Customize wall"
          title="Customize wall"
          (click)="appearanceOpen = !appearanceOpen">
          <img class="wall-action-icon" src="/assets/icons/section-colour.svg" alt="">
        </button>
        <div *ngIf="appearanceOpen" class="appearance-popover">
          <strong>Wall appearance</strong>
          <div class="wallpaper-grid">
            <label
              class="wallpaper-choice solid-color-choice"
              [class.selected]="wall.wallpaper === 'NONE'">
              <span class="wallpaper-thumbnail solid-color-thumbnail" [style.background-color]="wall.wallColor">
                <span class="palette-icon" aria-hidden="true">
                  <img src="/assets/icons/section-colour.svg" alt="">
                </span>
              </span>
              <span>Solid colour</span>
              <input
                type="color"
                class="solid-color-input"
                aria-label="Choose solid wall colour"
                [ngModel]="wall.wallColor"
                (click)="selectSolidColour()"
                (ngModelChange)="changeSolidColour($event)">
            </label>
            <button
              *ngFor="let option of wallpaperOptions"
              type="button"
              class="wallpaper-choice"
              [class.selected]="wall.wallpaper === option.value"
              (click)="changeWallpaper(option.value)">
              <span class="wallpaper-thumbnail" [ngClass]="'wallpaper-' + option.value.toLowerCase()"></span>
              <span>{{ option.label }}</span>
            </button>
          </div>
        </div>
      </div>
      <button
        type="button"
        class="item-delete-button"
        aria-label="Delete wall"
        title="Delete wall"
        (click)="deleteRequested.emit()">
        <img class="wall-action-icon" src="/assets/icons/section-delete.svg" alt="">
      </button>
    </div>
  </div>
</header>
