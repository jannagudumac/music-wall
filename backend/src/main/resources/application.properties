spring.application.name=music-wall-backend
server.port=8080

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/music_wall_rncp}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates and updates the tables from the Entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

cors.origin=${CORS_ORIGIN:http://localhost:4200}
